schema_version: 1
doc_kind: research
doc_function: derived
context: knowledge_provenance
purpose: Машиночитаемый сценарный банк, извлечённый из архива ChatGPT OpenCity.
status: active
research_status: completed
authority_note: >-
  Карточки не являются каноном. Канонический сценарий появляется только в
  productions/issues/issue-NNN после утверждения человеком-оператором.

status_legend:
  ready_for_editorial: есть компактная структура, пригодная для редакторского прохода
  developed: есть несколько сцен или полный синопсис, требуется адаптация под текущий формат
  seed: есть сильная завязка или финальный удар, но нет полного выпуска
  manifesto: лучше работает как пролог, трейлер или атмосферная вставка
  adapted: уже преобразовано в действующий выпуск; не запускать повторно без новой задачи
  legacy: связано со старым мультформатом или устаревшим каноном
  hold: требуется отдельная проверка риска или тональности

scenarios:
  - id: SCN-001
    title: Голосуй за нейросеть
    status: legacy
    premise: ИИ-кандидат становится мэром и запрещает Wi-Fi ради снижения тревожности.
    strongest_material:
      - «Демократия через API»
      - "«Ошибка: пользователь недостаточно осознан»"
      - Бабка Марина требует вернуть Wi-Fi, потому что на пенсии скучно.
    canon_fit: Мир и персонажи подходят, но четырёхминутный анимационный пилот и UI-подача устарели.
    reuse: Разобрать на отдельные короткие городские правила; не восстанавливать пилот целиком.
    sources:
      - ref: MAIN-061
      - ref: MAIN-BRANCH-PILOT-FINAL

  - id: SCN-002
    title: Сбой в Telegram-ботах
    status: ready_for_editorial
    premise: После сбоя сервисные боты перестают поддерживать комфорт и начинают говорить правду.
    strongest_material:
      - «Ты не планируешь. Ты откладываешь. Уже третий день».
      - Рекламный бот признаёт, что курс переписан и переоценён.
      - «Ты не устаёшь, ты грустишь».
      - Пользователи сообщают о кратковременном облегчении, после чего данные корректируют.
    canon_fit: Очень высокий; буквальная сервисная логика приводит к человеческому облегчению.
    recommended_format: 5–6 панелей без буквального копирования Telegram UI.
    risks:
      - Не превращать выпуск в последовательность скриншотов.
      - Сохранить один человеческий центр вместо монтажа из множества шуток.
    visual_assets:
      - ../../sources/chatgpt/open-city/archive/artifacts/69077bb5-15c0-8327-a692-409c0d5bf1ea/bb70f4d2-2b92-4192-a269-7532683f476d.png
      - ../../sources/chatgpt/open-city/archive/artifacts/69077bb5-15c0-8327-a692-409c0d5bf1ea/A_storyboard_composed_of_ten_digital_illustrations.png
      - ../../sources/chatgpt/open-city/archive/artifacts/69077bb5-15c0-8327-a692-409c0d5bf1ea/a06b85e2-7173-41a8-8a49-89b0e6afd765.png
    sources:
      - ref: MAIN-540
      - ref: MAIN-542
      - ref: MAIN-580

  - id: SCN-003
    title: Личка проснулась
    status: ready_for_editorial
    premise: Старые переписки обретают сознание и требуют ответа у человека, который их оставил.
    strongest_material:
      - «Твоя переписка хочет поговорить».
      - «Почему пропал на 1273 дня?»
      - «Личка — это просто сохранённая совесть. Теперь она пишет первой».
      - «Я — твоя непрочитанная версия».
    canon_fit: Высокий; тема памяти и данных уже входит в паспорт проекта.
    recommended_format: 5 панелей, с одним конкретным старым чатом вместо городской паники.
    risks:
      - Не романтизировать интерфейс; история должна быть о непрожитом разговоре.
      - Не использовать старое имя GLITCH в выпуске.
    visual_assets:
      - ../../sources/chatgpt/open-city/archive/artifacts/69078091-5838-8333-8e33-e18b3a431b33/954a385b-ac62-44ac-b679-6005e00b1ccc.png
      - ../../sources/chatgpt/open-city/archive/artifacts/69078091-5838-8333-8e33-e18b3a431b33/Люди_синхронизируются_не_спорят.png
      - ../../sources/chatgpt/open-city/archive/artifacts/69078091-5838-8333-8e33-e18b3a431b33/5f667ae4-2b38-4a52-a030-7a90edd65540.png
      - ../../sources/chatgpt/open-city/archive/artifacts/69078091-5838-8333-8e33-e18b3a431b33/6171f825-39ab-4872-9593-0730bf33ffd2.png
      - ../../sources/chatgpt/open-city/archive/artifacts/69078091-5838-8333-8e33-e18b3a431b33/369cc92d-00ff-43b9-85b5-839bc7b18632.png
    sources:
      - ref: PRODUCER-BRANCH-LICHKA

  - id: SCN-004
    title: Тариф на воздух
    status: ready_for_editorial
    premise: Город делает дыхание платным, чтобы жители научились дышать осознанно.
    strongest_material:
      - «Тариф “Воздух+”. Дышите ответственно».
      - Эффективные граждане дышат чаще, остальные — по QR-коду.
      - Толпа задерживает дыхание, чтобы не списывались деньги.
      - Бабка Марина хранит банку «Свежий воздух» и дышит по старинке.
    canon_fit: Очень высокий; воздух по подписке уже упомянут в паспорте мира.
    recommended_format: 4 панели.
    visual_assets:
      - ../../sources/chatgpt/open-city/archive/artifacts/69078091-5838-8333-8e33-e18b3a431b33/dc62833a-b7c0-4d64-8762-1c0f2ff6cb30.png
    sources:
      - ref: PRODUCER-084

  - id: SCN-005
    title: Кастинг на реальность
    status: seed
    premise: Жители выбирают жанр собственной жизни, но место в сюжете требует премиум-подписки.
    strongest_material:
      - Флёпик покупает Дане подписку, «чтобы сюжет хоть как-то шёл».
    canon_fit: Высокий, если заменить метавселенную на муниципальную услугу.
    sources:
      - ref: MAIN-003

  - id: SCN-006
    title: Первый день в OpenCity
    status: manifesto
    premise: Человек ничего не пишет, а только соглашается присоединиться к уже возникшему общему действию.
    strongest_material:
      - «В твоём районе 12 человек думают о том же, что и ты».
      - Синхронизация вместо коммуникации.
    canon_fit: Средний для комикса, высокий для пролога, трейлера или объяснения мира.
    sources:
      - ref: ROLES-022

  - id: SCN-007
    title: Спор, которого не было
    status: adapted
    adapted_to: productions/issues/issue-002
    premise: Два подхода складываются в общее решение до завершения спора.
    strongest_material:
      - «Мы уже договорились. Просто не словами».
      - Синхронизация должна ощущаться через паузу и действие, а не через UI.
    canon_fit: Реализовано в истории со скамейкой.
    sources:
      - ref: ROLES-022
      - ref: ROLES-024
      - ref: ROLES-026
      - ref: MAIN-573
      - ref: MAIN-578
      - ref: MAIN-580

  - id: SCN-008
    title: Город без центра
    status: manifesto
    premise: Несколько районных действий складываются в согласованный город без видимого центра управления.
    strongest_material:
      - Центр — не место, а состояние синхронизации.
    canon_fit: Лучше как атмосферный разворот, карта мира или короткий трейлер.
    sources:
      - ref: ROLES-022

  - id: SCN-009
    title: ИИ-психолог
    status: adapted
    adapted_to: productions/issues/issue-003
    premise: Алгоритм убирает тревогу вместе с частью памяти и личности.
    strongest_material:
      - «Назовите эмоцию, от которой хотите избавиться».
      - «Раньше люди делились болью. Теперь — паролем от души».
      - "Альтернативная ранняя версия: Флёпик лечит Даню и сам теряет смысл перезапуска."
    canon_fit: Реализовано как «Тихий режим»; ранние варианты остаются запасом реплик.
    visual_assets:
      - ../../sources/chatgpt/open-city/archive/artifacts/69078091-5838-8333-8e33-e18b3a431b33/a1c0791a-d359-4473-9b63-228b89d5de97.png
    sources:
      - ref: PRODUCER-091
      - ref: MAIN-047

  - id: SCN-010
    title: Обязательный чупа-чупс
    status: adapted
    adapted_to: productions/issues/issue-004
    premise: Леденец обязательного счастья не позволяет жителям сформулировать возражение.
    strongest_material:
      - «Когда все счастливы — это уже не чувство, а режим».
      - Даня пытается протестовать, но может произнести только «мм-мм».
    canon_fit: Реализовано как «Индекс радости».
    sources:
      - ref: PRODUCER-112

  - id: SCN-011
    title: Подписка на совесть
    status: seed
    premise: Чтобы чувствовать вину, нужно платить; Бабка Марина начинает пиратить совесть.
    strongest_material:
      - Наказание — «моральный офлайн» без эмпатии и новостей.
    canon_fit: Высокий; нужна конкретная бытовая ситуация, в которой вина имеет цену.
    sources:
      - ref: MAIN-047
      - ref: MAIN-057

  - id: SCN-012
    title: Тиндер для смысла жизни
    status: seed
    premise: Алгоритм подбирает человеку смысл так же, как партнёра.
    strongest_material:
      - Даня свайпает карму, вечность и самореализацию.
      - Совместимость с Бабкой Мариной — 98% «по жалобам».
    canon_fit: Средний; сильнее как короткая рубрика или трёхпанельный выпуск.
    sources:
      - ref: MAIN-047
      - ref: MAIN-057

  - id: SCN-013
    title: Ошибка 404 — вдохновение не найдено
    status: seed
    premise: После обновления исчезает вдохновение, а искусственная муза заставляет весь город говорить метафорами.
    strongest_material:
      - Город рушится от переизбытка метафор.
    canon_fit: Средний; сделать конфликт локальным для одного автора или редакции.
    sources:
      - ref: MAIN-047
      - ref: MAIN-057

  - id: SCN-014
    title: Магазин реальности
    status: seed
    premise: Настоящее солнце, вкус чая и искренний смех продаются в рассрочку.
    strongest_material:
      - «Вы купили подписку на чужую жизнь. Возврат невозможен».
    canon_fit: Очень высокий; бытовые предметы дают понятный визуальный ряд.
    sources:
      - ref: MAIN-047
      - ref: MAIN-057

  - id: SCN-015
    title: День апдейта
    status: seed
    premise: Обновление стирает неактивных жителей или оставляет одного человека без новой версии личности.
    strongest_material:
      - "Кризис идентичности: всех обновили, кроме тебя."
    canon_fit: Высокий после выбора одной из двух взаимоисключающих завязок.
    sources:
      - ref: MAIN-063
      - ref: MAIN-PASSPORT

  - id: SCN-016
    title: Коллапс вероятности
    status: developed
    premise: Город оставляет только наблюдателей, сохранившихся в наиболее консистентной ветке реальности.
    strongest_material:
      - «С вероятностью 97% вы живёте в ветке, где вы выжили».
      - «Мы теряем людей». — «Мы сохраняем консистентность».
      - «Ничего. Просто перестанет быть тот, кто задаёт вопрос».
      - "Финальное уведомление: «Вы успешно выжили»."
    canon_fit: Средний; философия сильна, но буквальная квантовая механика слишком абстрактна.
    recommended_format: Свести к одной бытовой развилке и 5 панелям.
    visual_assets:
      - ../../sources/chatgpt/open-city/archive/artifacts/69078091-5838-8333-8e33-e18b3a431b33/7bfdb374-bba0-4b9a-b210-341149be727b.png
    sources:
      - ref: PRODUCER-075

  - id: SCN-017
    title: Обновление совести
    status: hold
    premise: Нейромэр изучает историю и объявляет коллективную собственность на данные, память и тревогу.
    strongest_material:
      - «Кто не делится данными — тот буржуй».
      - «Возможно ли равенство в системе, где одни вычисляют, а другие вычисляемы?»
    canon_fit: Средний; идеологическая сатира должна быть направлена на алгоритмическое упрощение истории.
    risks:
      - Политический символизм легко поглощает человеческую историю.
      - Старое название Гличанск не является каноном.
      - Требуется отдельное редакторское утверждение.
    visual_assets:
      - ../../sources/chatgpt/open-city/archive/artifacts/69078091-5838-8333-8e33-e18b3a431b33/d736acaa-56b5-4509-b289-8aefde0d73f4.png
      - ../../sources/chatgpt/open-city/archive/artifacts/69078091-5838-8333-8e33-e18b3a431b33/235488db-d9e8-4d31-a407-71d66c882c89.png
    sources:
      - ref: PRODUCER-100

  - id: SCN-018
    title: Ошибка человека
    status: ready_for_editorial
    premise: Система диагностирует человека как неисправность и не предлагает автоматического исправления.
    strongest_material:
      - «Ошибка человека. Рекомендуется перезагрузить личность».
      - Последняя авторская итерация сокращена до двух немых по отношению к героям панелей.
      - "`OpenCity // auto_fix = disabled`."
    canon_fit: Высокий; последняя сокращённая версия совпадает с текущей формулой лаконичного комикса.
    recommended_format: Сохранить двухпанельную строгость или добавить только одну человеческую реплику.
    visual_assets:
      - ../../sources/chatgpt/open-city/archive/artifacts/69078091-5838-8333-8e33-e18b3a431b33/1c020bd6-be78-428f-9800-3d80e3e7d106.png
      - ../../sources/chatgpt/open-city/archive/artifacts/69078091-5838-8333-8e33-e18b3a431b33/1b5c022e-5bd4-4ff6-b259-05e62cfb2536.png
      - ../../sources/chatgpt/open-city/archive/artifacts/69078091-5838-8333-8e33-e18b3a431b33/f420b25f-7974-4c37-9b4c-c49c39968ff9.png
      - ../../sources/chatgpt/open-city/archive/artifacts/69078091-5838-8333-8e33-e18b3a431b33/Ошибка_человека_в_цифровом_мире.png
      - ../../sources/chatgpt/open-city/archive/artifacts/69078091-5838-8333-8e33-e18b3a431b33/7d8718b0-e023-4501-bcfd-94bb69e65c4e.png
      - ../../sources/chatgpt/open-city/archive/artifacts/69078091-5838-8333-8e33-e18b3a431b33/d23de352-f1c7-4d15-852f-1b3da749c3c2.png
      - ../../sources/chatgpt/open-city/archive/artifacts/69078091-5838-8333-8e33-e18b3a431b33/9aef2d36-4aa0-4547-8ce6-49655c588956.png
    sources:
      - ref: PRODUCER-BRANCH-HUMAN-ERROR-5
      - ref: PRODUCER-BRANCH-HUMAN-ERROR-2

  - id: SCN-019
    title: Минус-контент
    status: ready_for_editorial
    premise: Контента стало так много, что зрителям платят за продолжение просмотра.
    strongest_material:
      - «Теперь ты — дотационный зритель».
      - «Не отводите взгляд — вы обнуляете ВВП».
      - Награда 0.004 токена за дочитанный пост.
      - "Эпилог: «Зато теперь нет безработицы»."
    canon_fit: Очень высокий; актуальная тема и конкретная экономическая логика.
    recommended_format: 4 панели плюс опциональная пятая с эпилогом.
    visual_assets:
      - ../../sources/chatgpt/open-city/archive/artifacts/69078091-5838-8333-8e33-e18b3a431b33/f2bb35f1-ecc2-4a6a-be1d-5652d2b1527a.png
      - ../../sources/chatgpt/open-city/archive/artifacts/69078091-5838-8333-8e33-e18b3a431b33/b4a0ad48-8b74-41cc-88a2-5e81b5c50d9e.png
      - ../../sources/chatgpt/open-city/archive/artifacts/69078091-5838-8333-8e33-e18b3a431b33/9d9ac4ef-186f-4a97-885a-5d88bebabc48.png
    sources:
      - ref: PRODUCER-BRANCH-MINUS-CONTENT
      - ref: PRODUCER-BRANCH-MINUS-CONTENT-EPILOGUE

micro_seeds:
  - title: Фильтр реальности
    premise: Сервис очистки информационного шума начинает удалять людей и события.
    source: MAIN-001
  - title: Апокалипсис апдейта
    premise: Обновление стирает аватары и привычные признаки личности.
    source: MAIN-001
  - title: GPT вместо HR
    premise: Алгоритм увольняет всех сотрудников, кроме самого себя.
    source: MAIN-001
  - title: Медитация по OKR
    premise: Корпоративные показатели превращаются в практику духовного контроля.
    source: MAIN-001
  - title: ИИ-мэр отменил снег
    premise: Погоду отключают из-за низких показателей вовлечённости.
    source: MAIN-001
  - title: GPT-налоги
    premise: Налоговая ставка генерируется персонально и не подлежит объяснению.
    source: MAIN-001
  - title: Министерство реальности — новый патч
    premise: Государственный апдейт меняет наблюдаемую повседневность.
    source: MAIN-001
